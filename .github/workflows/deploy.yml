name: Deploy to Hugging Face

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Login to Hugging Face
      uses: docker/login-action@v2
      with:
        registry: registry.hf.space
        username: ${{ secrets.HF_USERNAME }}
        password: ${{ secrets.HF_TOKEN }}
        
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          registry.hf.space/${{ secrets.HF_USERNAME }}/nofx:latest
          registry.hf.space/${{ secrets.HF_USERNAME }}/nofx:${{ github.sha }}
          
    - name: Restart Space
      run: |
        curl -X POST \
          -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
          https://huggingface.co/api/spaces/${{ secrets.HF_USERNAME }}/nofx/restart
